name: Site preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/pages-preflight-20261116]

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate site before publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stage the GitHub Pages archive
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -r _site/.github
      - name: Check both volumes and downloads
        run: python3 .github/scripts/check-before-publish.py _site
