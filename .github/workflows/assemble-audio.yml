name: Assemble and verify original audio upload
on:
  push:
    branches: [feature/russian-audiobook]
    paths: ['.audio-staging/**', '.github/workflows/assemble-audio.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/feature/russian-audiobook'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/russian-audiobook
      - name: Restore byte-identical original and verify all MP3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root=Path('.audio-staging')
          if root.exists():
              parts=sorted(root.glob('chapter-7.part-*'))
              assert len(parts)==2
              original=b''.join(p.read_bytes() for p in parts)
              expected='5368f9d0b159ccb2334d2253ecf9276077e2ebd69edc1485ead022df34a72c05'
              assert hashlib.sha256(original).hexdigest()==expected
              Path('audio/chapter-7.mp3').write_bytes(original)
              shutil.rmtree(root)
          manifest=json.loads(Path('audio/manifest.json').read_text())
          assert len(manifest['tracks'])==15
          for t in manifest['tracks']:
              p=Path(t['src'])
              assert p.stat().st_size==t['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==t['sha256']
          print('Verified 15 original MP3 files; no audio processing performed.')
          PY
      - name: Save originals on the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/chapter-7.mp3
          git add -u .audio-staging || true
          if ! git diff --cached --quiet; then
            git commit -m 'Restore and verify byte-identical original chapter 7 MP3'
            git push origin HEAD:feature/russian-audiobook
          fi
